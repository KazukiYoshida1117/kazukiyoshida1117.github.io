<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>旅館 風ノ音 — LP</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #f5f3ef; font-family: sans-serif; }
  .header {
    position: fixed; top: 0; left: 0; right: 0; z-index: 10;
    background: rgba(245,243,239,.92); backdrop-filter: blur(6px);
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 24px; border-bottom: 1px solid #ddd;
  }
  .header h1 { font-size: 13px; color: #555; font-weight: 400; letter-spacing: .05em; }
  .header a {
    font-size: 12px; color: #888; text-decoration: none;
    border: 1px solid #bbb; padding: 4px 12px; border-radius: 3px;
  }
  .header a:hover { background: #eee; }
  .wrap {
    padding-top: 52px;
    display: flex; flex-direction: column; align-items: center;
  }
  .tab-btns {
    display: flex; gap: 8px; padding: 20px 0 12px;
    position: sticky; top: 52px; background: #f5f3ef; z-index: 5;
    border-bottom: 1px solid #e0ddd8; width: 100%; justify-content: center;
  }
  .tab-btns button {
    padding: 6px 20px; border: 1px solid #bbb; background: #fff;
    border-radius: 3px; font-size: 12px; cursor: pointer; color: #555;
    transition: all .15s;
  }
  .tab-btns button.active { background: #555; color: #fff; border-color: #555; }
  .view { display: none; width: 100%; justify-content: center; padding: 24px 16px 48px; }
  .view.active { display: flex; }
  .view img { max-width: 100%; height: auto; box-shadow: 0 4px 24px rgba(0,0,0,.12); }
  #pc-view img { max-width: 1200px; }
  #sp-view img { max-width: 390px; }
</style>
</head>
<body>
<div class="header">
  <h1>旅館 風ノ音 — ランディングページ</h1>
  <a href="../../.." onclick="window.close(); return false;">← 戻る</a>
</div>
<div class="wrap">
  <div class="tab-btns">
    <button class="active" onclick="showView('pc', this)">PC版</button>
    <button onclick="showView('sp', this)">スマホ版</button>
  </div>
  <div id="pc-view" class="view active">
    <img src="../PC版.png" alt="旅館 風ノ音 LP — PC版">
  </div>
  <div id="sp-view" class="view">
    <img src="../スマホ版.png" alt="旅館 風ノ音 LP — スマホ版">
  </div>
</div>
<script>
  function showView(id, btn) {
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    document.querySelectorAll('.tab-btns button').forEach(b => b.classList.remove('active'));
    document.getElementById(id + '-view').classList.add('active');
    btn.classList.add('active');
  }
</script>
</body>
</html>
