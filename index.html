<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ホームページ移転のお知らせ | Kazuki Yoshida</title>
<meta name="description" content="ホームページは新しいURLへ移転しました。自動的に新しいホームページへ移動します。">
<meta name="robots" content="noindex, follow">
<link rel="canonical" href="https://onebecomesforever.studio.site/home">
<meta http-equiv="refresh" content="8; url=https://onebecomesforever.studio.site/home">
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-22CGNYXTZH"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-22CGNYXTZH');
</script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root {
  --sky:   #4a9ab8;
  --sandl: #faf7f2;
  --navy:  #1a2e4a;
  --gold:  #b8963e;
  --text:  #334155;
  --muted: #7a8fa6;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Noto Sans JP', sans-serif; color: var(--text);
  background: var(--sandl); line-height: 1.8; font-size: 15px; font-weight: 300;
  min-height: 100vh; display: flex; align-items: center; justify-content: center;
  padding: 24px 16px;
}
.card {
  max-width: 560px; width: 100%; background: #fff; text-align: center;
  padding: 56px 32px; border-radius: 4px;
  box-shadow: 0 10px 40px rgba(26,46,74,.08);
}
.en {
  font-family: 'Cormorant Garamond', serif; font-style: italic;
  color: var(--gold); letter-spacing: .12em; font-size: 16px; margin-bottom: 8px;
}
h1 { color: var(--navy); font-weight: 500; font-size: 22px; margin-bottom: 20px; }
p { margin-bottom: 12px; }
.btn {
  display: inline-block; margin: 20px 0 16px; padding: 14px 32px;
  background: var(--navy); color: #fff; text-decoration: none;
  letter-spacing: .08em; font-size: 14px; transition: background .2s;
}
.btn:hover { background: var(--sky); }
.url { font-size: 13px; word-break: break-all; }
.url a { color: var(--sky); }
.note { color: var(--muted); font-size: 12px; margin-top: 16px; }
</style>
</head>
<body>
<main class="card">
  <div class="en">Notice</div>
  <h1>ホームページが新しくなりました</h1>
  <p>いつもご覧いただきありがとうございます。<br>ホームページは新しいURLへ移転いたしました。</p>
  <p>お手数ですが、ブックマーク等の変更をお願いいたします。</p>
  <a class="btn" href="https://onebecomesforever.studio.site/home">新しいホームページへ</a>
  <p class="url"><a href="https://onebecomesforever.studio.site/home">https://onebecomesforever.studio.site/home</a></p>
  <p class="note"><span id="count">8</span>秒後に自動的に移動します。</p>
</main>
<script>
  (function () {
    var n = 8, el = document.getElementById('count');
    var t = setInterval(function () {
      n--;
      if (n <= 0) {
        clearInterval(t);
        location.replace('https://onebecomesforever.studio.site/home');
      } else {
        el.textContent = n;
      }
    }, 1000);
  })();
</script>
</body>
</html>
